<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - DEMO BLOG</title>
  <style>
    :root {
      --primary-color: #1a73e8;
      --primary-hover: #174ea6;
      --text-primary: #202124;
      --text-secondary: #5f6368;
      --bg-color: #f8f9fb;
      --card-bg: #ffffff;
      --border-color: #dadce0;
    }

    * {
      box-sizing: border-box;
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 20% 20%, #eaf1fe 0%, var(--bg-color) 55%);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      max-width: 480px;
      width: calc(100% - 32px);
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 1px 3px rgba(60, 64, 67, 0.12), 0 8px 24px rgba(60, 64, 67, 0.08);
      margin: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      font-size: 26px;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      margin-bottom: 36px;
      text-decoration: none;
    }

    .logo-q {
      color: #1a73e8;
      font-weight: 700;
    }

    .logo-u {
      color: #d93025;
      font-weight: 700;
    }

    .logo-i {
      color: #f9ab00;
      font-weight: 700;
    }

    .logo-c {
      color: #137333;
      font-weight: 700;
    }

    .logo-word {
      font-weight: 500;
      margin-left: 6px;
    }

    .illustration-wrap {
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      animation: float 3s ease-in-out infinite;
    }

    .illustration-wrap img {
      width: 120px;
      height: 120px;
    }

    .illustration-wrap svg {
      width: 120px;
      height: 120px;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 10px 0;
      color: var(--text-primary);
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin: 0 0 8px 0;
    }

    .countdown {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0 0 28px 0;
    }

    .countdown span {
      font-weight: 600;
      color: var(--primary-color);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 12px 32px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 100px;
      cursor: pointer;
      box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
      transition: background-color 0.2s, box-shadow 0.2s, transform 0.15s;
      outline: none;
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 1px 3px 0 rgba(60, 64, 67, 0.3), 0 4px 8px 3px rgba(60, 64, 67, 0.15);
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
    }
  </style>
</head>
